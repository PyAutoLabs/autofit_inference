# lint.yml — PR / push-to-main gate.
#
# Cheap, fast, CPU-only. Runs on every PR and on push to main: ruff (check + format), the
# harness unit tests (numpy + pytest; the exporter fixture is validated against a fresh
# PyAutoInsight checkout), the README auto-table gate, the inference-summary gate, the
# WALL-BASIS gate and a lychee link check. No PyAuto library is installed here; the
# 1-seed Nautilus witness that does install PyAutoFit is witness.yml.

name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # export --check stamps the latest producer commit

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          pip install ruff numpy pytest pyyaml
          # lychee is a Rust binary; fetch the prebuilt release. The tarball
          # nests everything under lychee-x86_64-unknown-linux-gnu/, so strip
          # that leading directory and extract just the binary.
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # Checked out after ruff so its sources are never linted as this repo's.
      - name: Checkout PyAutoInsight (fixture validation)
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoInsight
          path: _deps/PyAutoInsight

      - name: unit tests
        env:
          PYAUTO_INSIGHT: ${{ github.workspace }}/_deps/PyAutoInsight
        run: python -m pytest -q scripts/misc/test

      - name: build_catalogue --check
        run: python scripts/misc/tooling/build_catalogue.py --check

      - name: build_readme --check
        run: python scripts/misc/tooling/build_readme.py --check

      - name: export_inference_summary --check
        run: python scripts/misc/tooling/export_inference_summary.py --check

      - name: WALL-BASIS gate
        run: python scripts/misc/wall/check_submits.py --check

      - name: lychee — markdown link-rot
        run: |
          # Exclude GitHub UI links that lychee tends to false-positive on, and the
          # Slack invite (302 -> 403 to any non-browser client).
          lychee \
            --exclude '^https://github\.com/.*/(issues|pull|commit|releases)/' \
            --exclude '^https://join\.slack\.com/' \
            --no-progress \
            --accept '200..=299,429' \
            --max-redirects 5 \
            README.md AGENTS.md
